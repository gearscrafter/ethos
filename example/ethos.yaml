# Example ethos.yaml — OPTIONAL user config.
#
# Lives at your project root. Ethos auto-detects it.
# Without this file, Ethos uses the built-in WCAG 2.2 spec as is.

widget_aliases:
  # The key is your widget's class name exactly as written in code.
  CircleIconBtn:
    role: button             # button | text | input
    label_arg: semanticLabel # which arg carries the accessible label
    size_guaranteed: true    # already wraps a >= 48x48 target internally?
    keyboard_ready: true     # keyboard-operable out of the box?

color_aliases:
  # Teach Ethos about your design-system color expressions so the contrast
  # rule can compute real WCAG ratios instead of reporting "indeterminate".
  # Key = exact source expression as written in code.
  # foreground: required. background: optional but needed for ratio calculation.
  "$styles.text.body":
    foreground: "#212121"
    background: "#FFFFFF"
  "$styles.colors.offWhite":
    foreground: "#FAFAFA"

# Optional: tighten or relax per-rule thresholds without rewriting the spec.
# rule_overrides:
#   wcag_1_4_3_contrast_minimum:
#     critical_threshold: 95