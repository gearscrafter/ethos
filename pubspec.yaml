name: ethos
description: Measure accessibility coverage in Flutter apps using WCAG 2.2 specifications with Spec-Driven Development.
version: 0.8.2
homepage: https://github.com/gearscrafter/ethos
repository: https://github.com/gearscrafter/ethos
issue_tracker: https://github.com/gearscrafter/ethos/issues
topics:
  - accessibility
  - wcag
  - flutter
  - testing
  - cli

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  analyzer: '>=7.1.0 <14.0.0'
  yaml: ^3.1.0
  args: ^2.4.0
  path: ^1.8.0
  collection: ^1.17.0
  matcher: ^0.12.0

dev_dependencies:
  test: ^1.26.3
  lints: ^6.1.0

executables:
  ethos: analyze

# Ethos is a Dart CLI tool — iOS, Android, and Web are intentionally excluded.
platforms:
  windows:
  macos:
  linux:

license: Apache-2.0